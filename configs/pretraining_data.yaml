# Pin dataset_revision to an immutable FineWeb-Edu commit for the final run.
dataset_name: HuggingFaceFW/fineweb-edu
dataset_config: sample-10BT
dataset_split: train
dataset_revision: main
text_field: text
seed: 1337
validation_fraction: 0.01
minimum_characters: 200
maximum_characters: 100000
normalize_line_endings: false
tokenizer_vocab_size: 16384
tokenizer_training_bytes: 100000000
target_tokens: 500000000
validation_target_tokens: 5000000
tokens_per_shard: 10000000
output_dtype: uint16
end_of_document_token: "<|endoftext|>"
output_directory: data/processed/fineweb_edu_500m
tokenizer_path: artifacts/tokenizers/fineweb_edu_bpe_16384.json
manifest_filename: manifest.json
